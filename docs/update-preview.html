<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,CanvasText)}main{width:min(100%,572px);margin:auto}article{background:var(--secondary,ButtonFace);padding:16px;border-radius:var(--radius,12px)}.meta,.row,nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.meta{font-size:14px;margin-bottom:12px}.meta small,p,nav{color:var(--muted-foreground,GrayText);font-size:12px}.meta small{font-variant-numeric:tabular-nums}.row h3{font-size:16px;margin:0;font-weight:600}.row p{margin:4px 0 0;line-height:1.5}button,select{cursor:pointer;font:inherit;color:inherit}#act{flex:none;border:0;border-radius:5px;padding:6px 10px;background:var(--primary,Highlight);color:var(--primary-foreground,HighlightText);font-weight:600;font-size:13px}#act:disabled{opacity:.5}nav{justify-content:flex-start;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border,GrayText);gap:8px}select{border:1px solid var(--border,GrayText);background:var(--background,Canvas);border-radius:5px;padding:3px 4px}label:last-child{margin-left:auto}#spin{display:none;width:14px;height:14px;border:2px solid var(--border,GrayText);border-top-color:var(--foreground,CanvasText);border-radius:50%;animation:spin 1s linear infinite;margin-left:auto;flex:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#spin{animation:none}}
</style><main><article aria-live="polite"><div class="meta"><span>软件更新</span><small><span id="edition">便携版</span> &nbsp;·&nbsp; <span id="current">v0.1.9</span></small></div><div class="row"><div><h3 id="title">新版本 0.1.10</h3><p id="detail">更新包 52.1 MB · 下载后可稍后重启</p></div><i id="spin"></i><button id="act">下载更新</button></div></article><nav aria-label="交互原型控制"><label>预览状态 <select id="state"><option>发现更新</option><option>下载中</option><option>可重启</option><option>已是最新</option><option>检查中</option><option>失败</option></select></label><label>版本 <select id="kind"><option>便携版</option><option>安装版</option></select></label></nav></main><script>
const el=id=>document.getElementById(id),state=el('state'),kind=el('kind');let timer;function draw(i){clearTimeout(timer);state.selectedIndex=i;const rows=[['新版本 0.1.10',`更新包 ${kind.selectedIndex?'19.6':'52.1'} MB · 下载后可稍后重启`,'下载更新'],['正在下载更新','下载后将校验文件，可继续翻译','下载中'],['0.1.10 已准备就绪','重启前请保存设置，并复制需要保留的草稿','重启并更新'],['已是最新版本','启动时自动检查稳定版','再次检查'],['正在检查更新','正在连接 GitHub Releases…','检查中'],['更新未完成','无法连接 GitHub，请检查网络','重新检查']];['title','detail','act'].forEach((k,j)=>el(k).textContent=rows[i][j]);el('edition').textContent=kind.value;el('current').textContent=i===3?'v0.1.10':'v0.1.9';const busy=i===1||i===4;el('act').disabled=busy;el('spin').style.display=busy?'inline-block':'none';el('act').style.background=i===0||i===2?'':'transparent';el('act').style.color=i===0||i===2?'':'inherit';el('act').style.boxShadow=i===0||i===2?'':'inset 0 0 0 1px var(--border,GrayText)';if(busy)timer=setTimeout(()=>draw(i===1?2:0),1800)}state.onchange=kind.onchange=()=>draw(state.selectedIndex);el('act').onclick=()=>draw(state.selectedIndex===0?1:state.selectedIndex===2?3:4);draw(0)
</script></html>
