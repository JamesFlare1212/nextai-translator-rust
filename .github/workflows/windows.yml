name: Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Locate Windows SDK shader compiler
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is missing' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --release --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Offline tests
        run: cargo test --release --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Live API test (gpt-6-luna)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          NEXTAI_TEST_API_KEY: ${{ secrets.NEW_API_KEY }}
        run: cargo test --release --locked --bin nextai-translator --target x86_64-pc-windows-msvc -- --ignored --exact live_tests::new_api_gpt_6_luna
      - name: Build Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/nextai-translator.exe, LICENSE, README.md dist
          Copy-Item docs/* dist/docs
      - uses: actions/upload-artifact@v4
        with:
          name: nextai-translator-windows-x64
          path: dist/
          if-no-files-found: error
