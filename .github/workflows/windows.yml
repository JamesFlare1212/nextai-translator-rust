name: Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to rebuild and publish (optional)
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a stable release tag' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Locate Windows SDK shader compiler
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is missing' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --release --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Offline tests
        run: cargo test --release --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Live API test (gpt-6-luna)
        if: env.RELEASE_TAG == '' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          NEXTAI_TEST_API_KEY: ${{ secrets.NEW_API_KEY }}
        run: cargo test --release --locked --bin nextai-translator --target x86_64-pc-windows-msvc -- --ignored --exact live_tests::new_api_gpt_6_luna
      - name: Build Windows setup and portable
        run: ./build.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item LICENSE, README.md dist
          Copy-Item docs/* dist/docs
      - uses: actions/upload-artifact@v4
        with:
          name: nextai-translator-windows-x64
          path: dist/
          if-no-files-found: error
      - name: Verify executable resources and smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$v") { throw 'Release tag must match Cargo.toml' }
          $exe = "dist/nextai-translator-$v-windows-x64-portable.exe"
          @'
          import ctypes as c, sys
          api = c.windll.version
          path = sys.argv[1]
          data = c.create_string_buffer(api.GetFileVersionInfoSizeW(path, None))
          assert api.GetFileVersionInfoW(path, 0, len(data), data), 'Missing VERSIONINFO'
          value, length = c.c_void_p(), c.c_uint()
          assert api.VerQueryValueW(data, r'\StringFileInfo\040904B0\FileDescription', c.byref(value), c.byref(length)), 'Missing FileDescription'
          assert c.wstring_at(value) == 'NextAI Translator', 'Unexpected FileDescription'
          '@ | python - (Resolve-Path $exe).Path
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/nextai-translator-$v-windows-x64-setup.exe", "dist/nextai-translator-$v-windows-x64-portable.exe" release-assets
          $dir = Join-Path $env:RUNNER_TEMP 'NextAI setup test'
          $setup = Get-Item "release-assets/*-setup.exe"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -or !(Test-Path "$dir/nextai-setup.marker") -or (Get-FileHash "$dir/nextai-translator.exe").Hash -ne (Get-FileHash $exe).Hash) { throw 'Installation failed' }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList '/VERYSILENT /NORESTART' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path "$dir/nextai-translator.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*.exe
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "$RELEASE_TAG" release-assets/*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
